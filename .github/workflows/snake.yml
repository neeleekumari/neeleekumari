# Save as: .github/workflows/snake.yml in the neeleekumari/neeleekumari repo
# (also save stats.py as: .github/scripts/stats.py)
name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#b36b00&color_dots=#ebedf0,#ffe9b3,#ffd166,#ffb000,#b36b00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffb000&color_dots=#161b22,#4d3a00,#8a6200,#d99100,#ffb000

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stats, languages and activity cards
        run: python .github/scripts/stats.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
