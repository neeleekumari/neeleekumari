<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Neelee Kumari - CSE engineer, full-stack, computer vision, GenAI" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <clipPath id="win"><rect width="1000" height="300" rx="16"/></clipPath>
    <clipPath id="l1"><rect x="36" y="62" height="34" width="0"><animate attributeName="width" from="0" to="400" begin="0.4s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="36" y="100" height="72" width="0"><animate attributeName="width" from="0" to="620" begin="1.2s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="36" y="180" height="30" width="0"><animate attributeName="width" from="0" to="640" begin="2.4s" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="36" y="216" height="30" width="0"><animate attributeName="width" from="0" to="640" begin="3.9s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <path id="road" d="M690 270 C 760 220, 790 170, 840 160 S 930 110, 970 70"/>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1000" height="300" fill="#0d1117"/>
    <rect width="1000" height="300" fill="url(#scan)"/>

    <!-- title bar -->
    <rect width="1000" height="38" fill="#161b22"/>
    <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="19" r="6" fill="#27c93f"/>
    <text x="500" y="24" text-anchor="middle" fill="#8b949e" font-size="13"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">neelee@github: ~</text>
    <line x1="0" y1="38" x2="1000" y2="38" stroke="#30363d"/>

    <!-- road motif (RoadIntel nod) -->
    <use href="#road" fill="none" stroke="#161b22" stroke-width="22" stroke-linecap="round"/>
    <use href="#road" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 9">
      <animate attributeName="stroke-dashoffset" from="0" to="-38" dur="1.6s" repeatCount="indefinite"/>
    </use>
    <circle r="5" fill="#ffb000" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#road"/></animateMotion>
    </circle>
    <circle cx="970" cy="70" r="14" fill="none" stroke="#ffb000" stroke-opacity="0.6">
      <animate attributeName="r" values="6;18;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
      <g clip-path="url(#l1)">
        <text x="36" y="86" font-size="20"><tspan fill="#ffb000">$</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
      </g>
      <g clip-path="url(#l2)">
        <text x="36" y="152" font-size="58" font-weight="700" fill="#ffb000" filter="url(#glow)">Neelee Kumari</text>
      </g>
      <g clip-path="url(#l3)">
        <text x="36" y="200" font-size="18" fill="#c9d1d9">&gt; CSE engineer · full-stack · computer vision · GenAI</text>
      </g>
      <g clip-path="url(#l4)">
        <text x="36" y="236" font-size="18" fill="#8b949e">&gt; building things that see, think &amp; ship</text>
      </g>
      <text x="36" y="274" font-size="18" fill="#ffb000" opacity="0">$
        <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.01s" fill="freeze"/>
      </text>
      <rect x="56" y="258" width="11" height="20" fill="#ffb000" opacity="0">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="5.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="none" stroke="#30363d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
