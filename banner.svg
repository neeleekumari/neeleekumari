<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Neelee Kumari banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24c6dc"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24c6dc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- moving waves -->
    <g>
      <path d="M0 200 Q 125 160 250 200 T 500 200 T 750 200 T 1000 200 T 1250 200 T 1500 200 V 260 H 0 Z" fill="url(#wave1)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M0 220 Q 125 190 250 220 T 500 220 T 750 220 T 1000 220 T 1250 220 T 1500 220 V 260 H 0 Z" fill="#ffffff" fill-opacity="0.07">
        <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="90" cy="45" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="95" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="30" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="40" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="75" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="35" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="110" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="150" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- text -->
    <text x="500" y="118" text-anchor="middle" fill="#ffffff" font-size="64" font-weight="700"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" letter-spacing="1">
      Neelee Kumari
      <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="500" y="165" text-anchor="middle" fill="#d9f6fb" font-size="22"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" letter-spacing="2">
      Building things that see, think &amp; ship
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.4s" fill="freeze"/>
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
